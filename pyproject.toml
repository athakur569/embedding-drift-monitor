[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-drift-monitor"
version = "0.1.0"
description = "Mahalanobis and energy-score drift detection from encoder embeddings"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhishek Thakur", email = "a.thakur5690@gmail.com"}]
requires-python = ">=3.9"
keywords = ["drift-detection", "OOD", "embeddings", "Mahalanobis", "model-monitoring"]
dependencies = ["numpy>=1.24.0", "scipy>=1.10.0", "scikit-learn>=1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
